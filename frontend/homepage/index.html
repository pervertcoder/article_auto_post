<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/frontend/homepage/style.css" />
    <script src="/frontend/homepage/index.js" defer></script>
    <title>Article_Auto_Post</title>
  </head>
  <body>
    <div class="main">
      <header class="head">
        <h1>Article_Auto_Post</h1>
      </header>
      <section class="workarea">
        <label for="post"
          >Write down the content you want to post on the social media
          platforms.</label
        >
        <section class="paragraph_function">
          <div class="button_add">
            <button id="add" type="button">Add paragraph</button>
          </div>
          <div class="button_delete">
            <button id="delete" type="button">Delete paragraph</button>
          </div>
        </section>
        <textarea
          name="post"
          id="post_a"
          class="poster"
          data-id="0"
          rows="10"
          cols="30"
        ></textarea>
      </section>
      <section class="function">
        <div class="button_ig">
          <button id="ig" type="button">Post on Instagram</button>
        </div>
        <div class="button_threads">
          <button id="threads" type="button">Post on Threads</button>
        </div>
        <div class="button_X">
          <button id="X" type="button">Post on X</button>
        </div>
      </section>
    </div>
    <div class="blank"></div>
    <footer></footer>
  </body>
</html>
